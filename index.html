<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Lớp — Quản lý lớp dạy kèm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --paper:#F2F7FC;
  --panel:#FFFFFF;
  --panel-2:#EAF2FB;
  --ink:#0E2A4A;
  --ink-soft:#4C6685;
  --ink-faint:#93A7C4;
  --rule:#1C6FD9;
  --rule-dark:#12508F;
  --rule-bg:#E1EDFB;
  --red:#C23B3B;
  --red-bg:#FBEAEA;
  --green:#1F8A5F;
  --green-bg:#E3F4EB;
  --gold:#B07F17;
  --gold-bg:#FBF0D9;
  --line:#D7E4F3;
  --line-soft:#E9F1FB;
  --shadow:0 1px 3px rgba(14,42,74,.08);
  --shadow-lg:0 12px 32px rgba(14,42,74,.18);
  --radius:9px;
  --sidebar-w:252px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{font-family:'Lora',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:20px 20px 16px 20px;
  border-bottom:1px solid var(--line-soft);
}
.brand-mark{
  width:36px;height:36px;border-radius:8px;
  background:var(--rule);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-mark svg{width:20px;height:20px;}
.brand-text .name{font-family:'Lora',serif;font-weight:700;font-size:17px;line-height:1.1;color:var(--ink);}
.brand-text .tag{font-size:11px;color:var(--ink-faint);margin-top:2px;}

.nav-scroll{flex:1;overflow-y:auto;padding:14px 12px;}
.nav-group-label{font-size:11.5px;color:var(--ink-faint);padding:14px 10px 6px 10px;letter-spacing:.2px;}
.nav-group-label:first-child{padding-top:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;
  border-radius:7px;
  color:var(--ink-soft);
  font-size:14px;font-weight:500;
  cursor:pointer;
  border-left:3px solid transparent;
  margin-bottom:1px;
}
.nav-item:hover{background:var(--panel-2);color:var(--ink);}
.nav-item.active{background:var(--rule-bg);color:var(--rule-dark);border-left-color:var(--rule);font-weight:600;}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}

.sidebar-foot{border-top:1px solid var(--line-soft);padding:12px;}
.teacher-chip{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;}
.teacher-avatar{width:30px;height:30px;border-radius:50%;background:var(--gold-bg);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden;}
.teacher-avatar img{width:100%;height:100%;object-fit:cover;}
.avatar-upload{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.avatar-upload .preview{width:64px;height:64px;border-radius:50%;background:var(--gold-bg);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex-shrink:0;overflow:hidden;border:1px solid var(--line);}
.avatar-upload .preview img{width:100%;height:100%;object-fit:cover;}
.avatar-upload .actions{display:flex;flex-direction:column;gap:6px;}
.avatar-upload input[type=file]{display:none;}
.teacher-chip .t-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2;}
.teacher-chip .t-role{font-size:11px;color:var(--ink-faint);}

/* ---------- Main ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:26px 32px 18px 32px;
  border-bottom:1px solid var(--line);
  background:var(--paper);
}
#topbar h1{font-size:23px;margin:0;color:var(--ink);font-weight:600;}
#topbar .subtitle{font-size:13px;color:var(--ink-soft);margin-top:4px;}
#topbar .today{font-size:12.5px;color:var(--ink-faint);}
#content{padding:26px 32px 60px 32px;}

/* ---------- Generic components ---------- */
.row{display:flex;align-items:center;}
.between{justify-content:space-between;}
.gap8{gap:8px;}.gap10{gap:10px;}.gap12{gap:12px;}.gap16{gap:16px;}
.mb16{margin-bottom:16px;}.mb20{margin-bottom:20px;}.mb24{margin-bottom:24px;}

.btn{
  font-family:'Inter',sans-serif;
  font-size:13.5px;font-weight:600;
  padding:8px 15px;
  border-radius:7px;
  border:1px solid transparent;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.btn-primary{background:var(--rule);color:#fff;}
.btn-primary:hover{background:var(--rule-dark);}
.btn-secondary{background:var(--panel);border-color:var(--line);color:var(--ink);}
.btn-secondary:hover{background:var(--panel-2);}
.btn-danger{background:var(--panel);border-color:var(--red-bg);color:var(--red);}
.btn-danger:hover{background:var(--red-bg);}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:5px;border-radius:6px;color:var(--ink-faint);display:inline-flex;}
.icon-btn:hover{background:var(--panel-2);color:var(--ink);}
.icon-btn.del:hover{background:var(--red-bg);color:var(--red);}
.icon-btn svg{width:15px;height:15px;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.stat-card .label{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
.stat-card .value{font-family:'Lora',serif;font-size:25px;font-weight:700;color:var(--ink);}
.stat-card .value .unit{font-size:14px;font-weight:500;color:var(--ink-faint);margin-left:2px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.panel-pad{padding:18px 20px;}
.panel-title{font-family:'Lora',serif;font-size:16px;font-weight:600;color:var(--ink);}
.panel-sub{font-size:12px;color:var(--ink-faint);margin-top:2px;}

table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.data-table thead th{
  text-align:left;font-size:11.5px;color:var(--ink-faint);font-weight:600;
  padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2);
}
table.data-table thead th:first-child{border-top-left-radius:var(--radius);}
table.data-table thead th:last-child{border-top-right-radius:var(--radius);}
table.data-table tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink);vertical-align:top;}
table.data-table tbody tr:hover{background:var(--panel-2);}
table.data-table tbody tr:last-child td{border-bottom:none;}
.empty-row td{text-align:center;color:var(--ink-faint);padding:28px;font-size:13px;}

.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;}
.badge-good{background:var(--green-bg);color:var(--green);}
.badge-warn{background:var(--gold-bg);color:var(--gold);}
.badge-bad{background:var(--red-bg);color:var(--red);}
.badge-neutral{background:var(--rule-bg);color:var(--rule-dark);}
.badge-flat{background:var(--panel-2);color:var(--ink-soft);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0;}

.tag-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);}
.empty-state svg{width:38px;height:38px;opacity:.4;margin-bottom:10px;}
.empty-state .msg{font-size:13.5px;}

/* ---------- Forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;}
.field input,.field select,.field textarea{
  width:100%;font-family:'Inter',sans-serif;font-size:13.5px;
  border:1px solid var(--line);border-radius:7px;padding:9px 11px;
  background:var(--panel);color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--rule-bg);border-color:var(--rule);}
.field textarea{resize:vertical;min-height:64px;font-family:'Inter',sans-serif;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.check-grid{display:flex;flex-wrap:wrap;gap:8px;}
.check-chip{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer;}
.check-chip input{width:auto;margin:0;}

/* ---------- Modal ---------- */
#modal-root{position:fixed;inset:0;z-index:100;display:none;}
#modal-root.open{display:block;}
.modal-overlay{position:absolute;inset:0;background:rgba(31,42,68,.45);}
.modal-box{
  position:relative;background:var(--panel);border-radius:12px;
  width:520px;max-width:92vw;max-height:86vh;overflow-y:auto;
  margin:5vh auto 0 auto;box-shadow:var(--shadow-lg);
}
.modal-box.wide{width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel);z-index:2;border-radius:12px 12px 0 0;}
.modal-head h3{margin:0;font-size:17px;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--line-soft);}
.close-x{cursor:pointer;color:var(--ink-faint);background:none;border:none;padding:4px;border-radius:6px;}
.close-x:hover{background:var(--panel-2);color:var(--ink);}

/* ---------- Toast ---------- */
#toast-root{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(6px);transition:all .2s ease;}
.toast.show{opacity:1;transform:translateY(0);}

/* ---------- Calendar ---------- */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.cal-nav{display:flex;align-items:center;gap:6px;}
.cal-nav .cal-label{font-family:'Lora',serif;font-weight:600;font-size:15.5px;min-width:130px;text-align:center;}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
.seg button{border:none;background:var(--panel);padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.seg button.active{background:var(--rule);color:#fff;}

.month-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--line-soft);gap:1px;}
.month-grid .dow{background:var(--panel-2);text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-faint);padding:8px 0;}
.month-cell{background:var(--panel);min-height:104px;padding:6px 7px;position:relative;}
.month-cell.other{background:var(--panel-2);}
.month-cell.today{background:var(--rule-bg);}
.month-cell .daynum{font-size:12px;font-weight:700;color:var(--ink-soft);}
.month-cell.today .daynum{color:var(--rule-dark);}
.chip{font-size:10.5px;padding:2px 5px;border-radius:4px;color:#fff;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.chip-more{font-size:10.5px;color:var(--ink-faint);margin-top:3px;cursor:pointer;}

.week-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);}
.week-head{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--line);}
.week-head .wh{padding:9px 4px;text-align:center;border-left:1px solid var(--line-soft);}
.week-head .wh:first-child{border-left:none;}
.week-head .wh .dname{font-size:11px;color:var(--ink-faint);font-weight:700;}
.week-head .wh .ddate{font-size:14px;font-weight:700;color:var(--ink);}
.week-head .wh.today{background:var(--rule-bg);}
.week-body{display:grid;grid-template-columns:56px repeat(7,1fr);position:relative;}
.week-timecol{display:flex;flex-direction:column;}
.week-hour{height:44px;font-size:10.5px;color:var(--ink-faint);text-align:right;padding-right:6px;border-top:1px solid var(--line-soft);transform:translateY(-6px);}
.week-day-col{position:relative;border-left:1px solid var(--line-soft);background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 43px, var(--line-soft) 44px);}
.week-block{position:absolute;left:3px;right:3px;border-radius:5px;color:#fff;padding:3px 6px;font-size:10.5px;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);}
.week-block .wb-name{font-weight:700;}

/* ---------- Bars / mini charts ---------- */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.bar-row .b-label{width:96px;font-size:12.5px;color:var(--ink-soft);flex-shrink:0;}
.bar-track{flex:1;height:9px;background:var(--line-soft);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;}
.bar-row .b-val{width:90px;text-align:right;font-size:12px;color:var(--ink);font-weight:600;flex-shrink:0;}

/* ---------- Invoice preview ---------- */
.invoice{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);}
.invoice-head{background:var(--ink);color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;}
.invoice-head .t-name{font-family:'Lora',serif;font-size:16px;font-weight:600;}
.invoice-head .t-phone{font-size:12px;opacity:.75;margin-top:2px;}
.invoice-total-box{background:var(--gold);color:#fff;border-radius:8px;padding:9px 16px;text-align:right;}
.invoice-total-box .l{font-size:10.5px;opacity:.85;}
.invoice-total-box .v{font-family:'Lora',serif;font-size:19px;font-weight:700;}
.invoice-body{padding:22px 24px;}
.invoice-title{text-align:center;font-family:'Lora',serif;font-size:20px;font-weight:700;letter-spacing:.5px;margin-bottom:2px;}
.invoice-sub{text-align:center;font-size:12px;color:var(--ink-faint);margin-bottom:18px;}
.invoice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
.invoice-kv{font-size:13px;margin-bottom:5px;}
.invoice-kv b{color:var(--ink);}
.invoice-note{background:var(--panel-2);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);margin-top:12px;}

/* ---------- Fee card (ảnh phiếu học phí xuất ra) ---------- */
.fee-card{
  --fb:#8FC1F0; /* border blue */
  width:560px;max-width:100%;
  background-color:#EAF4FE;
  background-image:
    linear-gradient(rgba(28,111,217,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(28,111,217,.07) 1px, transparent 1px);
  background-size:16px 16px;
  border:2.5px solid var(--fb);border-radius:24px;
  padding:22px 20px 26px;margin:0 auto;
  font-family:'Inter',system-ui,sans-serif;position:relative;overflow:hidden;
}
.fee-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;position:relative;z-index:2;}
.fee-card-top .gv{font-weight:800;font-size:13.5px;color:var(--rule-dark);}
.fee-card-top .phone{font-weight:800;font-size:13px;color:var(--rule-dark);}

.fee-cloud{position:relative;margin:8px 2px 18px;padding:22px 26px;text-align:center;background:#DCEEFC;border:2.5px solid var(--fb);border-radius:38px 42px 40px 44px/54px 46px 58px 50px;}
.fee-cloud h2{margin:0;font-family:'Lora',serif;font-weight:800;font-size:23px;line-height:1.32;color:var(--rule-dark);text-transform:uppercase;letter-spacing:.2px;}
.fee-cloud .arrow{display:inline-block;color:var(--fb);font-weight:400;margin:0 6px;}
.fee-cloud .doodle{position:absolute;color:var(--fb);}
.fee-cloud .d1{top:8px;left:14px;}
.fee-cloud .d2{top:12px;right:18px;}
.fee-cloud .d3{bottom:10px;left:26px;}
.fee-cloud .d4{bottom:14px;right:32px;}
.fee-cloud .d5{color:var(--fb);top:-6px;right:-4px;}

.fee-name-band{position:relative;background:#fff;border:2.5px solid var(--fb);border-radius:16px;padding:16px 20px;text-align:center;margin:0 2px 16px;}
.fee-name-band .pill{display:inline-block;background:var(--rule-bg);color:var(--rule-dark);font-weight:800;font-size:11px;letter-spacing:1px;padding:4px 16px;border-radius:20px;margin-bottom:9px;}
.fee-name-band .name-row{display:flex;align-items:center;justify-content:center;gap:10px;}
.fee-name-band .name-row .heart{color:var(--rule-dark);flex-shrink:0;}
.fee-name-band .name-row .swirl{color:var(--fb);flex-shrink:0;display:inline-flex;}
.fee-name-band .name{font-family:'Lora',serif;font-weight:800;font-size:21px;color:var(--rule-dark);}
.fee-name-band .sub{font-family:'Lora',serif;font-size:13px;font-weight:700;color:var(--rule-dark);margin-top:4px;}

.fee-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 2px 12px;}
.fee-box{background:#fff;border:2.5px solid var(--fb);border-radius:16px;padding:14px 16px;}
.fee-box-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;color:var(--rule-dark);margin-bottom:11px;letter-spacing:.2px;text-transform:uppercase;}
.fee-box-title .ic{color:var(--rule-dark);flex-shrink:0;display:inline-flex;}
.fee-row2{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line-soft);}
.fee-row2:last-child{border-bottom:none;}
.fee-row2 .ic{width:17px;flex-shrink:0;text-align:center;color:var(--rule-dark);display:inline-flex;justify-content:center;margin-top:1px;}
.fee-row2 .k{color:var(--ink-soft);min-width:84px;flex-shrink:0;}
.fee-row2 .v{font-weight:700;color:var(--ink);}
.fee-sessions{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11px;color:var(--ink-soft);margin:2px 0 7px 26px;}
.fee-status-pill{display:inline-block;background:var(--rule-bg);color:var(--rule-dark);font-weight:700;font-size:11.5px;padding:3px 10px;border-radius:8px;}

.fee-total-wrap{text-align:center;}
.fee-total-wrap .fee-box-title{justify-content:center;}
.fee-total-wrap .amt{font-family:'Lora',serif;font-weight:800;font-size:28px;color:var(--rule-dark);margin:2px 0;}
.fee-total-wrap .extra{font-size:11.5px;color:var(--ink-faint);margin-bottom:10px;}
.fee-qr{display:flex;flex-direction:column;align-items:center;gap:8px;}
.fee-qr img{width:128px;height:128px;border-radius:8px;border:1px solid var(--line);}
.fee-qr .badges{display:flex;gap:10px;align-items:center;font-size:13px;margin-top:2px;}
.vqr-badge{color:var(--rule-dark);font-weight:800;}
.vqr-badge b{color:#E0393E;}
.napas-badge{background:#EAF2FB;color:var(--rule-dark);padding:2px 9px;border-radius:6px;font-weight:800;font-style:italic;}
.napas-badge em{color:#E0393E;font-style:normal;}
.fee-bank{font-size:11.5px;color:var(--ink-soft);line-height:1.8;text-align:left;width:100%;margin-top:4px;}
.fee-bank b{color:var(--ink);}

.txt{font-size:12.5px;color:var(--ink);line-height:1.6;}
.fee-wide{position:relative;background:#fff;border:2.5px solid var(--fb);border-radius:16px;padding:13px 18px;display:flex;align-items:center;gap:16px;margin:0 2px 12px;}
.fee-wide .lbl{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;color:var(--rule-dark);flex-shrink:0;min-width:150px;text-transform:uppercase;}
.fee-wide .lbl .ic{color:var(--rule-dark);display:inline-flex;}
.fee-wide .div{width:1.5px;align-self:stretch;background:var(--line);}
.fee-wide .meet-txt{display:flex;align-items:center;gap:8px;}

.fee-foot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 2px 14px;}

.fee-banner{position:relative;background:var(--rule-bg);border-radius:20px;text-align:center;padding:11px;font-size:12.5px;font-weight:700;color:var(--rule-dark);margin:6px 2px 4px;}
.fee-banner .heart{color:var(--rule-dark);vertical-align:-3px;margin:0 4px;}
.fee-corner{position:absolute;z-index:1;}
.fee-corner.bl{bottom:10px;left:10px;}
.fee-corner.br{bottom:8px;right:10px;}

/* ---------- Class mode tabs ---------- */
.mode-tabs{display:flex;gap:6px;background:var(--panel-2);border-radius:9px;padding:4px;width:fit-content;}
.mode-tab{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.mode-tab.active{background:var(--panel);color:var(--rule-dark);box-shadow:var(--shadow);}
.mode-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
.mode-pill.online{background:#E3F0FF;color:#1C6FD9;}
.mode-pill.offline{background:#FBF0D9;color:#B07F17;}
.student-name-link{cursor:pointer;}
.student-name-link:hover{color:var(--rule);text-decoration:underline;}

/* ---------- Requests / feedback list ---------- */
.list-card{border:1px solid var(--line);border-radius:9px;padding:13px 16px;margin-bottom:10px;background:var(--panel);}
.list-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.list-card .who{font-weight:700;font-size:13.5px;}
.list-card .when{font-size:11.5px;color:var(--ink-faint);}
.list-card .body{font-size:13px;color:var(--ink-soft);line-height:1.5;}
.stars{color:var(--gold);font-size:13px;letter-spacing:1px;}

@media print{
  #sidebar,#topbar,.no-print{display:none !important;}
  #content{padding:0;}
  body{background:#fff;}
}

/* =========================================================
   RESPONSIVE — máy tính bảng
   ========================================================= */
@media (max-width:900px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .fee-grid,.fee-foot-grid,.invoice-grid{grid-template-columns:1fr;}
}

   ========================================================= */

  #app.sidebar-open #sidebar{transform:translateX(0);}
  #sidebarOverlay{
    position:fixed;inset:0;background:rgba(14,42,74,.45);z-index:140;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  #app.sidebar-open #sidebarOverlay{opacity:1;pointer-events:auto;}

  #main{width:100%;min-width:0;}
  #topbar{padding:16px 16px 14px 16px;flex-wrap:wrap;gap:8px;}
  #topbar h1{font-size:19px;}
  #topbar .today{display:none;}
  #content{padding:16px 14px 40px 14px;}

  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-card{padding:12px 13px;}
  .stat-card .value{font-size:20px;}

  .field-row{grid-template-columns:1fr;gap:0;}
  .fee-grid,.fee-foot-grid,.invoice-grid{grid-template-columns:1fr;}

  .modal-box.wide{width:94vw;}
  .modal-head,.modal-body,.modal-foot{padding-left:16px;padding-right:16px;}

  /* Bảng dữ liệu: cho cuộn ngang thay vì bị bóp méo */
  table.data-table{display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.data-table thead,table.data-table tbody,table.data-table tr{display:table;width:100%;table-layout:auto;}

  /* Lịch tuần/tháng: cho cuộn ngang, giữ nguyên tỉ lệ ô */
  .week-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .week-head,.week-body{min-width:600px;}

  .cal-nav .cal-label{min-width:auto;font-size:14px;}

  .panel-pad{padding:14px 15px;}
  .fee-card{padding:18px 14px 20px;}
}

/* Thông tin ngân hàng chuẩn hiện tại của giáo viên. Nếu dữ liệu đã lưu (localStorage/Supabase)
   từ trước còn mang thông tin ngân hàng cũ/mặc định (MB Bank...), hàm này sẽ tự đồng bộ lại
   về đúng thông tin bên dưới, để mã QR và nhãn ngân hàng luôn khớp nhau dù dữ liệu cũ đến đâu. */
const CURRENT_BANK_INFO = { bankName:'Vietcombank', bankAccount:'0385569139', bankAccountName:'CAO THI PHUONG THU' };
const STALE_BANK_NAMES = ['mb bank','mb','mbbank'];
const STALE_BANK_ACCOUNTS = ['0978654345'];
function syncBankInfo(){
  if(!state || !state.settings) return false;
  const s = state.settings;
  const bn = (s.bankName||'').trim().toLowerCase();
  const isStale = STALE_BANK_NAMES.includes(bn) || STALE_BANK_ACCOUNTS.includes((s.bankAccount||'').trim()) || !s.bankName || !s.bankAccount;
  if(isStale && bn !== CURRENT_BANK_INFO.bankName.toLowerCase()){
    Object.assign(s, CURRENT_BANK_INFO);
    return true;
  }
  return false;
}

async function loadState(){
  // 1) Ưu tiên Supabase nếu đã cấu hình
  if(SUPABASE_ENABLED){
    try{
      const { data, error } = await sb.from('app_state').select('data').eq('id', SUPABASE_ROW_ID).maybeSingle();
      if(error) throw error;
      if(data && data.data){
        state = data.data;
        if(syncBankInfo()){ await persist(); }
        // vẫn giữ một bản sao ở localStorage để mở nhanh lần sau / phòng mất mạng
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
        return;
      }
    }catch(e){
      console.error('Supabase load lỗi, dùng dữ liệu cục bộ:', e);
      toast('Không tải được dữ liệu từ Supabase, dùng bản lưu cục bộ');
    }
  }
  // 2) Nếu chưa cấu hình Supabase hoặc lỗi mạng -> dùng localStorage
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      state = JSON.parse(raw);
      if(syncBankInfo()){ await persist(); }
      return;
    }
  }catch(e){ /* ignore */ }
  // 3) Lần đầu chạy -> dữ liệu mẫu
  state = seedData();
  await persist();
}

let saveTimer=null;
async function persist(){
  // Luôn lưu cục bộ trước để không mất dữ liệu nếu mất mạng
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error('localStorage lỗi', e); }
  if(SUPABASE_ENABLED){
    try{
      const { error } = await sb.from('app_state').upsert({ id: SUPABASE_ROW_ID, data: state, updated_at: new Date().toISOString() });
      if(error) throw error;
    }catch(e){
      console.error('Supabase lưu lỗi:', e);
      toast('Không đồng bộ được lên Supabase (đã lưu tạm ở máy)');
    }
  }
}
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 250);
}

function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),250); }, 2400);
}

let modalSubmitHandler = null;
function openModal(title, bodyHtml, onSubmit, wide){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalBox').classList.toggle('wide', !!wide);
  document.getElementById('modal-root').classList.add('open');
  modalSubmitHandler = onSubmit;
  const form = document.getElementById('modalForm');
  if(form){
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const data = {};
      fd.forEach((v,k)=>{
        if(data[k]!==undefined){
          if(Array.isArray(data[k])) data[k].push(v); else data[k]=[data[k],v];
        } else data[k]=v;
      });
      // include unchecked checkbox groups as empty arrays
      form.querySelectorAll('[data-multi]').forEach(el=>{
        const name = el.getAttribute('data-multi');
        if(!(name in data)) data[name]=[];
        else if(!Array.isArray(data[name])) data[name]=[data[name]];
      });
      if(modalSubmitHandler) modalSubmitHandler(data);
      closeModal();
    });
  }
}
function closeModal(){
  document.getElementById('modal-root').classList.remove('open');
  modalSubmitHandler=null;
}

/* =========================================================
   PIE CHART (SVG)
   items: [{label, value, color}]
   ========================================================= */
function pieChartSVG(items, opts){
  opts = opts||{};
  const size = opts.size || 168;
  const r = size/2;
  const cx = r, cy = r;
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  let angle = -90; // start at top
  let paths = '';
  items.forEach(it=>{
    const frac = it.value/total;
    const sweep = frac*360;
    if(frac<=0){ return; }
    if(frac>=0.9999){
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${it.color}"></circle>`;
    } else {
      const a0 = angle*Math.PI/180, a1 = (angle+sweep)*Math.PI/180;
      const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
      const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
      const large = sweep>180?1:0;
      paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${it.color}"></path>`;
    }
    angle += sweep;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.56}" fill="var(--panel)"></circle></svg>`;
}
function pieLegendHtml(items){
  const total = items.reduce((s,i)=>s+i.value,0) || 1;
  return items.map(it=>`
    <div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line-soft);">
      <div class="row gap10"><span class="dot" style="background:${it.color}"></span><span style="font-size:13px;color:var(--ink-soft);">${escapeHtml(it.label)}</span></div>
      <div class="row gap10">
        <span class="mono" style="font-size:12px;color:var(--ink-faint);">${(it.value/total*100).toFixed(0)}%</span>
        <span class="mono" style="font-size:13px;font-weight:600;">${fmtMoney(it.value)}</span>
      </div>
    </div>`).join('');
}

function bankBin(bankName){
  const n = (bankName||'').toLowerCase();
  // Ưu tiên khớp từ khoá DÀI hơn trước, để tránh nhận nhầm các từ khoá ngắn (vd 'mb')
  // vốn tình cờ nằm lọt bên trong tên ngân hàng khác (vd 'vietcoMBank' chứa 'mb').
  const sorted = [...VIETQR_BANKS].sort((a,b)=>b[0].length-a[0].length);
  const found = sorted.find(([kw])=>n.includes(kw));
  return found? found[1] : null;
}
function vietQrImage(bankName, account, amount, addInfo, accountName){
  const bin = bankBin(bankName);
  if(!bin || !account) return null;
  const params = new URLSearchParams({
    amount: Math.max(0, Math.round(amount||0)),
    addInfo: addInfo||'',
    accountName: accountName||''
  });
  return `https://img.vietqr.io/image/${bin}-${account}-compact2.png?${params.toString()}`;
}

/* helpers */
function classById(id){ return state.classes.find(c=>c.id===id); }
function studentById(id){ return state.students.find(s=>s.id===id); }
function studentsOfClass(id){ return state.students.filter(s=>s.classId===id); }
function classOptionsHtml(selectedId){
  return state.classes.map(c=>`<option value="${c.id}" ${c.id===selectedId?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
}
function studentOptionsHtml(selectedId){
  return state.students.map(s=>`<option value="${s.id}" ${s.id===selectedId?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
}
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function monthLabel(key){
  const [y,m]=key.split('-');
  return `Tháng ${parseInt(m)}/${y}`;
}
function currentMonthKey(){ return monthKey(isoDate(new Date())); }

/* =========================================================
   OVERVIEW
   ========================================================= */
function renderOverview(){
  const mKey = currentMonthKey();
  const sessionsThisMonth = state.sessions.filter(s=>monthKey(s.date)===mKey);
  const totalHours = sessionsThisMonth.reduce((sum,s)=>{
    const [sh,sm]=s.startTime.split(':').map(Number);
    const [eh,em]=s.endTime.split(':').map(Number);
    return sum + ((eh*60+em)-(sh*60+sm))/60;
  },0);
  const revenueThisMonth = sessionsThisMonth.reduce((sum,s)=>{
    const cl = classById(s.classId);
    return sum + (cl? cl.fee * studentsOfClass(cl.id).length : 0);
  },0);
  const activeStudents = state.students.filter(s=>s.status==='active').length;

  // upcoming sessions (today & future, sorted)
  const now = new Date();
  const upcoming = state.sessions
    .filter(s=> new Date(s.date+'T'+s.startTime) >= new Date(now.getFullYear(),now.getMonth(),now.getDate()))
    .sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime))
    .slice(0,4);

  // revenue by class (this month)
  const revByClass = state.classes.map(c=>{
    const cnt = sessionsThisMonth.filter(s=>s.classId===c.id).length;
    return {name:c.name, color:c.color, value: cnt * c.fee * studentsOfClass(c.id).length};
  }).sort((a,b)=>b.value-a.value);
  const maxRev = Math.max(1, ...revByClass.map(r=>r.value));

  // revenue last 6 months (bar)
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(monthKey(isoDate(d)));
  }
  const revByMonth = months.map(mk=>{
    const sess = state.sessions.filter(s=>monthKey(s.date)===mk && s.status!=='scheduled' || monthKey(s.date)===mk);
    const val = state.sessions.filter(s=>monthKey(s.date)===mk).reduce((sum,s)=>{
      const cl = classById(s.classId);
      return sum + (cl? cl.fee*studentsOfClass(cl.id).length : 0);
    },0);
    return {mk, val};
  });
  const maxMonthRev = Math.max(1, ...revByMonth.map(r=>r.val));

  return `
    <div class="stat-grid mb24">
      <div class="stat-card"><div class="label">Học sinh đang theo học</div><div class="value">${activeStudents}</div></div>
      <div class="stat-card"><div class="label">Số buổi dạy tháng này</div><div class="value">${sessionsThisMonth.length}</div></div>
      <div class="stat-card"><div class="label">Tổng giờ dạy tháng này</div><div class="value">${totalHours.toFixed(1)}<span class="unit">giờ</span></div></div>
      <div class="stat-card"><div class="label">Doanh thu tháng này</div><div class="value" style="font-size:20px;">${fmtMoney(revenueThisMonth)}</div></div>
    </div>
    <div class="row gap16" style="align-items:flex-start;">
      <div class="panel panel-pad" style="flex:1.3;">
        <div class="row between mb16">
          <div>
            <div class="panel-title">Lịch dạy sắp tới</div>
            <div class="panel-sub">Các buổi học gần nhất</div>
          </div>
          <button class="btn btn-secondary btn-sm" data-action="nav" data-view="schedule">Xem toàn bộ lịch</button>
        </div>
        ${upcoming.length? upcoming.map(s=>{
          const cl = classById(s.classId);
          const isToday = s.date===isoDate(now);
          return `<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line-soft);">
            <div class="row gap10">
              <span class="dot" style="background:${cl?cl.color:'#999'}"></span>
              <div>
                <div style="font-weight:600;font-size:13.5px;">${cl?escapeHtml(cl.name):'—'}</div>
                <div style="font-size:12px;color:var(--ink-faint);">${cl?escapeHtml(cl.level):''} · ${studentsOfClass(cl?cl.id:'').length} học sinh</div>
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:600;font-size:13px;">${isToday?'Hôm nay':fmtDateFull(s.date)}</div>
              <div style="font-size:12px;color:var(--ink-faint);">${s.startTime} - ${s.endTime}</div>
            </div>
          </div>`;
        }).join('') : '<div class="empty-state"><div class="msg">Chưa có buổi học sắp tới</div></div>'}
      </div>
      <div class="panel panel-pad" style="flex:1;">
        <div class="panel-title mb16">Doanh thu theo lớp</div>
        <div class="panel-sub mb16" style="margin-top:-10px;">Theo tiến thực thu — ${monthLabel(mKey)}</div>
        ${revByClass.some(r=>r.value>0) ? `
        <div class="row gap16" style="align-items:center;">
          <div style="flex-shrink:0;">${pieChartSVG(revByClass.map(r=>({label:r.name,value:r.value,color:r.color})), {size:150})}</div>
          <div style="flex:1;min-width:0;">${pieLegendHtml(revByClass.map(r=>({label:r.name,value:r.value,color:r.color})))}</div>
        </div>` : '<div class="empty-state"><div class="msg">Chưa có doanh thu để hiển thị</div></div>'}
      </div>
    </div>
    <div class="panel panel-pad mb24" style="margin-top:16px;">
      <div class="panel-title mb16">Doanh thu 6 tháng gần đây</div>
      ${revByMonth.some(r=>r.val>0) ? `
      <div class="row gap16" style="align-items:center;">
        <div style="flex-shrink:0;">${pieChartSVG(revByMonth.map((r,i)=>({label:`${r.mk.slice(5)}/${r.mk.slice(2,4)}`,value:r.val,color:MONTH_PIE_COLORS[i%MONTH_PIE_COLORS.length]})), {size:150})}</div>
        <div style="flex:1;min-width:0;">${pieLegendHtml(revByMonth.map((r,i)=>({label:`Tháng ${r.mk.slice(5)}/${r.mk.slice(2,4)}`,value:r.val,color:MONTH_PIE_COLORS[i%MONTH_PIE_COLORS.length]})))}</div>
      </div>` : '<div class="empty-state"><div class="msg">Chưa có doanh thu để hiển thị</div></div>'}
    </div>
  `;
}
const MONTH_PIE_COLORS = ['#1C6FD9','#1F8A5F','#C23B3B','#B07F17','#7B5EC7','#2AA1A1'];

/* =========================================================

function renderReports(){

    return {c, sessCount:sess.length, stCount, revenue};

    </div>
    <div class="panel mb24">
      <div class="panel-pad" style="padding-bottom:0;">
        <div class="panel-title">Báo cáo theo lớp — ${monthLabel(mKey)}</div>
        <div class="panel-sub mb16">Số buổi, sĩ số và doanh thu ước tính từng lớp</div>

        <thead><tr><th>Lớp</th><th>Sĩ số</th><th>Số buổi</th><th>Học phí/buổi</th><th>Doanh thu ước tính</th></tr></thead>
        <tbody>

            <td><span class="dot" style="background:${r.c.color}"></span>${escapeHtml(r.c.name)}</td>

function renderSchedule(){
  const toolbar = `
    <div class="cal-toolbar no-print">
      <div class="row gap12">
        <div class="cal-nav">
          <button class="icon-btn" data-action="cal-prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
          <div class="cal-label">${calLabel()}</div>
          <button class="icon-btn" data-action="cal-next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
        <button class="btn btn-secondary btn-sm" data-action="cal-today">Hôm nay</button>
        <div class="seg">
          <button class="${calMode==='week'?'active':''}" data-action="cal-mode" data-mode="week">Tuần</button>
          <button class="${calMode==='month'?'active':''}" data-action="cal-mode" data-mode="month">Tháng</button>
        </div>
      </div>

function calLabel(){
  if(calMode==='week'){
    const s = startOfWeek(calCursor);
    const e = addDays(s,6);
    return `${fmtDate(isoDate(s))} - ${fmtDateFull(isoDate(e))}`;
  }
  return `Tháng ${calCursor.getMonth()+1}/${calCursor.getFullYear()}`;
}

function scheduleSummaryHtml(){
  let rangeSessions;
  if(calMode==='week'){
    const s = startOfWeek(calCursor), e = addDays(s,6);
    rangeSessions = state.sessions.filter(sess=> sess.date>=isoDate(s) && sess.date<=isoDate(e));
  } else {
    const mk = monthKey(isoDate(calCursor));
    rangeSessions = state.sessions.filter(sess=> monthKey(sess.date)===mk);
  }
  const totalHours = rangeSessions.reduce((sum,s)=>{
    const [sh,sm]=s.startTime.split(':').map(Number);
    const [eh,em]=s.endTime.split(':').map(Number);
    return sum + ((eh*60+em)-(sh*60+sm))/60;
  },0);
  const totalRevenue = rangeSessions.reduce((sum,s)=>{
    const cl = classById(s.classId);
    return sum + (cl? cl.fee*studentsOfClass(cl.id).length : 0);
  },0);
  return `
    <div class="stat-grid mb16">
      <div class="stat-card"><div class="label">Tổng buổi</div><div class="value">${rangeSessions.length}</div></div>
      <div class="stat-card"><div class="label">Tổng giờ</div><div class="value">${totalHours.toFixed(1)}</div></div>
      <div class="stat-card"><div class="label">Số lớp hoạt động</div><div class="value">${new Set(rangeSessions.map(s=>s.classId)).size}/${state.classes.length}</div></div>
      <div class="stat-card"><div class="label">Tổng tiền công</div><div class="value" style="font-size:19px;">${fmtMoney(totalRevenue)}</div></div>
    </div>
  `;
}

function renderWeekGrid(){
  const start = startOfWeek(calCursor);
  const days = Array.from({length:7},(_,i)=>addDays(start,i));
  const hourStart=7, hourEnd=21;
  const hours = Array.from({length:hourEnd-hourStart+1},(_,i)=>hourStart+i);
  const todayIso = isoDate(new Date());

  const head = `<div class="week-head">
    <div></div>
    ${days.map(d=>`<div class="wh ${isoDate(d)===todayIso?'today':''}"><div class="dname">${WEEKDAY_SHORT[d.getDay()]}</div><div class="ddate">${d.getDate()}/${d.getMonth()+1}</div></div>`).join('')}
  </div>`;

  const timeCol = `<div class="week-timecol">${hours.map(h=>`<div class="week-hour">${h}:00</div>`).join('')}</div>`;

  const dayCols = days.map(d=>{
    const diso = isoDate(d);
    const daySessions = state.sessions.filter(s=>s.date===diso);
    const blocks = daySessions.map(s=>{
      const cl = classById(s.classId);
      const [sh,sm]=s.startTime.split(':').map(Number);
      const [eh,em]=s.endTime.split(':').map(Number);
      const top = ((sh*60+sm)-(hourStart*60))/60*44;
      const height = Math.max(20, ((eh*60+em)-(sh*60+sm))/60*44 - 2);
      return `<div class="week-block" style="top:${top}px;height:${height}px;background:${cl?cl.color:'#888'};" data-action="view-session" data-id="${s.id}">
        <div class="wb-name">${cl?escapeHtml(cl.name):'—'}</div>
        <div>${s.startTime}-${s.endTime}</div>
      </div>`;
    }).join('');
    return `<div class="week-day-col" style="height:${hours.length*44}px;">${blocks}</div>`;
  }).join('');

  return `<div class="week-wrap">${head}<div class="week-body">${timeCol}${dayCols}</div></div>`;
}

function renderMonthGrid(){
  const first = startOfMonth(calCursor);
  const gridStart = startOfWeek(first);
  const cells = Array.from({length:42},(_,i)=>addDays(gridStart,i));
  const todayIso = isoDate(new Date());
  const curMonth = calCursor.getMonth();

  const dow = WEEKDAY_SHORT.slice(1).concat(WEEKDAY_SHORT[0]).map(d=>`<div class="dow">${d}</div>`).join('');

  const cellsHtml = cells.map(d=>{
    const diso = isoDate(d);
    const daySessions = state.sessions.filter(s=>s.date===diso).sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const isOther = d.getMonth()!==curMonth;
    const isToday = diso===todayIso;
    const shown = daySessions.slice(0,3);
    const more = daySessions.length-shown.length;
    return `<div class="month-cell ${isOther?'other':''} ${isToday?'today':''}">
      <div class="daynum">${d.getDate()}</div>
      ${shown.map(s=>{
        const cl=classById(s.classId);
        return `<div class="chip" style="background:${cl?cl.color:'#888'}" data-action="view-session" data-id="${s.id}">${s.startTime} ${cl?escapeHtml(cl.name):''}</div>`;
      }).join('')}
      ${more>0?`<div class="chip-more">+${more} khác</div>`:''}
    </div>`;
  }).join('');

  return `<div class="cal-scroll"><div class="month-grid">${dow}${cellsHtml}</div></div>`;
}

function ythucBadge(y){
  const map = {'Tốt':'badge-good','Khá':'badge-neutral','Lười học':'badge-warn','Mất tập trung':'badge-bad','Nói chuyện riêng':'badge-bad'};
  return `<span class="badge ${map[y]||'badge-flat'}">${escapeHtml(y||'—')}</span>`;
}
function btvnBadge(v){
  const n=Number(v);
  let cls='badge-good'; if(n<50) cls='badge-bad'; else if(n<80) cls='badge-warn';
  return `<span class="badge ${cls}">${n}%</span>`;
}

      <td class="mono">${fmtMoney(inv.feePerSession)}</td>
      <td class="mono" style="font-weight:700;">${fmtMoney(total)}</td>
      <td><span class="badge ${inv.status==='paid'?'badge-good':'badge-warn'}">${inv.status==='paid'?'Đã thu':'Chưa thu'}</span></td>
      <td>
        <div class="row gap8">
          <button class="icon-btn" data-action="view-invoice" data-id="${inv.id}" title="Xem phiếu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>

        </div>

    </tr>`;
  }).join('');

function attachDelegation(){
  document.getElementById('content').addEventListener('click', handleContentClick);
  document.getElementById('content').addEventListener('change', handleContentChange);
  document.getElementById('content').addEventListener('submit', handleContentSubmit);
  document.getElementById('modal-root').addEventListener('click', handleModalClick);
  document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebarMobile);
  document.getElementById('sidebarOverlay').addEventListener('click', closeSidebarMobile);
}
function toggleSidebarMobile(){ document.getElementById('app').classList.toggle('sidebar-open'); }
function closeSidebarMobile(){ document.getElementById('app').classList.remove('sidebar-open'); }

async function exportInvoiceImage(){
  const node = document.getElementById('feeCardCapture');
  if(!node){ toast('Không tìm thấy phiếu để xuất ảnh'); return; }
  if(typeof html2canvas==='undefined'){ toast('Chưa tải được thư viện xuất ảnh, kiểm tra kết nối mạng'); return; }
  try{
    toast('Đang tạo ảnh...');
    const canvas = await html2canvas(node, {backgroundColor:'#F2F7FC', scale:2, useCORS:true});
    const link = document.createElement('a');
    link.download = 'phieu-hoc-phi.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(e){
    console.error(e);
    toast('Xuất ảnh thất bại, thử dùng nút In / Xuất PDF thay thế');
  }
}

function handleModalClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');
  const id = t.getAttribute('data-id');
  if(action==='modal-close'){ closeModal(); return; }
  if(action==='delete-session'){ if(confirm('Xoá buổi học này?')){ state.sessions = state.sessions.filter(s=>s.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá buổi học'); } }
  if(action==='delete-class'){ if(confirm('Xoá lớp học này? Học sinh trong lớp sẽ không còn gán lớp.')){ state.classes = state.classes.filter(c=>c.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá lớp học'); } }
  if(action==='delete-student'){ if(confirm('Xoá học sinh này?')){ state.students = state.students.filter(s=>s.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá học sinh'); } }
  if(action==='delete-assistant'){ if(confirm('Xoá trợ giảng này?')){ state.assistants = state.assistants.filter(a=>a.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá trợ giảng'); } }
  if(action==='delete-studylog'){ if(confirm('Xoá nhật ký này?')){ state.studyLogs = state.studyLogs.filter(l=>l.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá nhật ký'); } }
  if(action==='delete-grade'){ if(confirm('Xoá điểm số này?')){ state.grades = state.grades.filter(g=>g.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá điểm số'); } }
  if(action==='delete-invoice'){ if(confirm('Xoá phiếu học phí này?')){ state.invoices = state.invoices.filter(i=>i.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá phiếu học phí'); } }
  if(action==='print-invoice'){ window.print(); }
  if(action==='export-invoice-image'){ exportInvoiceImage(); }
}

function handleContentClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');
  const id = t.getAttribute('data-id');

  switch(action){
    case 'nav': navigate(t.getAttribute('data-view')); break;
    case 'class-mode-filter': classModeFilter = t.getAttribute('data-mode'); renderView(); break;

    /* schedule */
    case 'cal-prev': calCursor = calMode==='week'? addDays(calCursor,-7) : new Date(calCursor.getFullYear(), calCursor.getMonth()-1, 1); renderView(); break;
    case 'cal-next': calCursor = calMode==='week'? addDays(calCursor,7) : new Date(calCursor.getFullYear(), calCursor.getMonth()+1, 1); renderView(); break;
    case 'cal-today': calCursor = new Date(); renderView(); break;
    case 'cal-mode': calMode = t.getAttribute('data-mode'); renderView(); break;
    case 'open-add-session': openModal('Ghi buổi học mới', sessionFormHtml(null), (data)=>{
        state.sessions.push({id:uid(), classId:data.classId, date:data.date, startTime:data.startTime, endTime:data.endTime, note:data.note||'', status:'scheduled'});
        scheduleSave(); renderView(); toast('Đã thêm buổi học');
      }); break;
    case 'view-session': case 'edit-session': {
      const sess = state.sessions.find(s=>s.id===id);
      if(!sess) return;
      openModal('Chi tiết buổi học', sessionFormHtml(sess), (data)=>{
        Object.assign(sess, {classId:data.classId, date:data.date, startTime:data.startTime, endTime:data.endTime, note:data.note||''});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }

    /* classes */
    case 'open-add-class': openModal('Thêm lớp học', classFormHtml(null), (data)=>{
        state.classes.push({id:uid(), name:data.name, level:data.level, subject:data.subject, fee:Number(data.fee), schedule:data.schedule||'', color:data.color||CLASS_COLORS[0], note:data.note||'', mode:data.mode==='online'?'online':'offline', courseSessions:data.courseSessions?Number(data.courseSessions):0});
        scheduleSave(); renderView(); toast('Đã thêm lớp học');
      }); break;
    case 'edit-class': {
      const cl = classById(id); if(!cl) return;
      openModal('Sửa lớp học', classFormHtml(cl), (data)=>{
        Object.assign(cl, {name:data.name, level:data.level, subject:data.subject, fee:Number(data.fee), schedule:data.schedule||'', color:data.color||cl.color, note:data.note||'', mode:data.mode==='online'?'online':'offline', courseSessions:data.courseSessions?Number(data.courseSessions):0});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-class': if(confirm('Xoá lớp học này?')){ state.classes = state.classes.filter(c=>c.id!==id); scheduleSave(); renderView(); toast('Đã xoá lớp học'); } break;

    /* students */
    case 'open-add-student': openModal('Thêm học sinh', studentFormHtml(null), (data)=>{
        state.students.push({id:uid(), name:data.name, classId:data.classId||'', dob:data.dob||'', parentName:data.parentName||'', parentPhone:data.parentPhone||'', address:data.address||'', note:data.note||'', status:data.status||'active'});
        scheduleSave(); renderView(); toast('Đã thêm học sinh');
      }); break;
    case 'edit-student': {
      const st = studentById(id); if(!st) return;
      openModal('Sửa thông tin học sinh', studentFormHtml(st), (data)=>{
        Object.assign(st, {name:data.name, classId:data.classId||'', dob:data.dob||'', parentName:data.parentName||'', parentPhone:data.parentPhone||'', address:data.address||'', note:data.note||'', status:data.status||'active'});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-student': if(confirm('Xoá học sinh này?')){ state.students = state.students.filter(s=>s.id!==id); scheduleSave(); renderView(); toast('Đã xoá học sinh'); } break;

    /* assistants */
    case 'open-add-assistant': openModal('Thêm trợ giảng', assistantFormHtml(null), (data)=>{
        state.assistants.push({id:uid(), name:data.name, phone:data.phone||'', email:data.email||'', assignedClassIds:data.assignedClassIds||[], note:data.note||''});
        scheduleSave(); renderView(); toast('Đã thêm trợ giảng');
      }); break;
    case 'edit-assistant': {
      const a = state.assistants.find(x=>x.id===id); if(!a) return;
      openModal('Sửa trợ giảng', assistantFormHtml(a), (data)=>{
        Object.assign(a, {name:data.name, phone:data.phone||'', email:data.email||'', assignedClassIds:data.assignedClassIds||[], note:data.note||''});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-assistant': if(confirm('Xoá trợ giảng này?')){ state.assistants = state.assistants.filter(a=>a.id!==id); scheduleSave(); renderView(); toast('Đã xoá trợ giảng'); } break;

    /* study log */
    case 'open-add-studylog': openModal('Ghi nhật ký buổi học', studyLogFormHtml(null), (data)=>{
        state.studyLogs.push({id:uid(), studentId:data.studentId, sessionNo:data.sessionNo||'', date:data.date, content:data.content||'', btvn:Number(data.btvn||0), ythuc:data.ythuc||'', nhanxet:data.nhanxet||'', ghichu:data.ghichu||''});
        scheduleSave(); renderView(); toast('Đã thêm nhật ký');
      }); break;
    case 'edit-studylog': {
      const l = state.studyLogs.find(x=>x.id===id); if(!l) return;
      openModal('Sửa nhật ký học tập', studyLogFormHtml(l), (data)=>{
        Object.assign(l, {studentId:data.studentId, sessionNo:data.sessionNo||'', date:data.date, content:data.content||'', btvn:Number(data.btvn||0), ythuc:data.ythuc||'', nhanxet:data.nhanxet||'', ghichu:data.ghichu||''});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-studylog': if(confirm('Xoá nhật ký này?')){ state.studyLogs = state.studyLogs.filter(l=>l.id!==id); scheduleSave(); renderView(); toast('Đã xoá nhật ký'); } break;

    /* grades */
    case 'open-add-grade': openModal('Thêm điểm số', gradeFormHtml(null), (data)=>{
        state.grades.push({id:uid(), studentId:data.studentId, subject:data.subject||'Toán', testName:data.testName, score:Number(data.score), date:data.date, note:data.note||''});
        scheduleSave(); renderView(); toast('Đã thêm điểm số');
      }); break;
    case 'edit-grade': {
      const g = state.grades.find(x=>x.id===id); if(!g) return;
      openModal('Sửa điểm số', gradeFormHtml(g), (data)=>{
        Object.assign(g, {studentId:data.studentId, subject:data.subject||'Toán', testName:data.testName, score:Number(data.score), date:data.date, note:data.note||''});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-grade': if(confirm('Xoá điểm số này?')){ state.grades = state.grades.filter(g=>g.id!==id); scheduleSave(); renderView(); toast('Đã xoá điểm số'); } break;

    /* tuition */
    case 'open-add-invoice': openModal('Tạo phiếu học phí', invoiceFormHtml(null), (data)=>{
        state.invoices.push({id:uid(), studentId:data.studentId, month:data.month, sessions:Number(data.sessions), feePerSession:Number(data.feePerSession), extra:Number(data.extra||0), note:data.note||'', status:data.status||'unpaid'});
        scheduleSave(); renderView(); toast('Đã tạo phiếu học phí');
      }); break;
    case 'view-invoice': {
      const inv = state.invoices.find(x=>x.id===id); if(!inv) return;
      openModal('Phiếu học phí', invoicePreviewHtml(inv), null, true);
      break;
    }
    case 'view-student-fee': {
      const st = studentById(id); if(!st) return;
      const mKey = currentMonthKey();
      const invList = state.invoices.filter(i=>i.studentId===id).sort((a,b)=>b.month.localeCompare(a.month));
      const inv = invList.find(i=>i.month===mKey) || invList[0];
      if(inv){
        openModal('Phiếu học phí', invoicePreviewHtml(inv), null, true);
      } else {
        openModal('Tạo phiếu học phí', invoiceFormHtml(null, id), (data)=>{
          state.invoices.push({id:uid(), studentId:data.studentId, month:data.month, sessions:Number(data.sessions), feePerSession:Number(data.feePerSession), extra:Number(data.extra||0), note:data.note||'', status:data.status||'unpaid'});
          scheduleSave(); renderView(); toast('Đã tạo phiếu học phí');
        });
        toast('Học sinh chưa có phiếu học phí nào — hãy tạo phiếu đầu tiên');
      }
      break;
    }
    case 'mark-paid': {
      const inv = state.invoices.find(x=>x.id===id); if(!inv) return;
      inv.status='paid'; scheduleSave(); renderView(); toast('Đã đánh dấu đã thu');
      break;
    }
    case 'delete-invoice': if(confirm('Xoá phiếu học phí này?')){ state.invoices = state.invoices.filter(i=>i.id!==id); scheduleSave(); renderView(); toast('Đã xoá phiếu học phí'); } break;

    /* requests */
    case 'open-add-request': openModal('Thêm yêu cầu', requestFormHtml(), (data)=>{
        state.requests.push({id:uid(), from:data.from, content:data.content, date:data.date||isoDate(new Date()), status:data.status||'Mới'});
        scheduleSave(); renderView(); toast('Đã thêm yêu cầu');
      }); break;
    case 'delete-request': if(confirm('Xoá yêu cầu này?')){ state.requests = state.requests.filter(r=>r.id!==id); scheduleSave(); renderView(); toast('Đã xoá yêu cầu'); } break;

    /* feedback */
    case 'open-add-feedback': openModal('Thêm góp ý', feedbackFormHtml(), (data)=>{
        state.feedback.push({id:uid(), from:data.from, content:data.content, rating:Number(data.rating||5), date:data.date||isoDate(new Date())});
        scheduleSave(); renderView(); toast('Đã thêm góp ý');
      }); break;
    case 'delete-feedback': if(confirm('Xoá góp ý này?')){ state.feedback = state.feedback.filter(f=>f.id!==id); scheduleSave(); renderView(); toast('Đã xoá góp ý'); } break;

    /* payments */
    case 'open-add-payment': openModal('Ghi nhận thanh toán', paymentFormHtml(), (data)=>{
        state.payments.push({id:uid(), studentId:data.studentId, amount:Number(data.amount), date:data.date, method:data.method||'Chuyển khoản', note:data.note||''});
        scheduleSave(); renderView(); toast('Đã ghi nhận thanh toán');
      }); break;
    case 'delete-payment': if(confirm('Xoá giao dịch này?')){ state.payments = state.payments.filter(p=>p.id!==id); scheduleSave(); renderView(); toast('Đã xoá giao dịch'); } break;

    /* settings avatar */
    case 'remove-avatar': {
      const urlField = document.getElementById('avatarUrlField');
      if(urlField) urlField.value = '';
      const preview = document.getElementById('avatarPreview');
      if(preview) preview.textContent = (document.querySelector('#settingsForm [name=teacherName]').value||'G').trim().charAt(0).toUpperCase();
      const removeBtn = e.target.closest('[data-action="remove-avatar"]');
      if(removeBtn) removeBtn.remove();
      break;
    }
  }
}

function handleContentChange(e){
  if(e.target.id==='studyLogFilterSelect'){ studyLogFilter = e.target.value; renderView(); }
  if(e.target.id==='gradeFilterSelect'){ gradeFilter = e.target.value; renderView(); }
  if(e.target.id==='reqFilterSelect'){ requestFilterStatus = e.target.value; renderView(); }
  if(e.target.getAttribute && e.target.getAttribute('data-action')==='change-request-status'){
    const id = e.target.getAttribute('data-id');
    const r = state.requests.find(x=>x.id===id);
    if(r){ r.status = e.target.value; scheduleSave(); renderView(); toast('Đã cập nhật trạng thái'); }
  }
  if(e.target.id==='avatarFile'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 1.5*1024*1024){ toast('Ảnh quá lớn, vui lòng chọn ảnh dưới 1.5MB'); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      document.getElementById('avatarUrlField').value = dataUrl;
      document.getElementById('avatarPreview').innerHTML = `<img src="${dataUrl}" alt="Ảnh đại diện">`;
    };
    reader.readAsDataURL(file);
  }
}

function handleContentSubmit(e){
  if(e.target.id==='settingsForm'){
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {};
    fd.forEach((v,k)=>data[k]=v);
    state.settings = {...state.settings, ...data};
    scheduleSave();
    renderSidebar();
    toast('Đã lưu cài đặt');
  }
}

  document.getElementById('topToday').textContent = new Date().toLocaleDateString('vi-VN', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  await loadState();
  attachDelegation();
  renderSidebar();
  navigate('overview');
}
init();
</script>
