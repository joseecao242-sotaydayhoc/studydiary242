function attachDelegation(){
  document.getElementById('content').addEventListener('click', handleContentClick);
  document.getElementById('content').addEventListener('change', handleContentChange);
  document.getElementById('content').addEventListener('submit', handleContentSubmit);
  document.getElementById('modal-root').addEventListener('click', handleModalClick);
  document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebarMobile);
  document.getElementById('sidebarOverlay').addEventListener('click', closeSidebarMobile);
  document.getElementById('sidebar').addEventListener('click', (e)=>{
    const item = e.target.closest('.nav-item');
    if(!item) return;
    if(item.id==='navLogoutItem'){ logout(); return; }
    const view = item.getAttribute('data-view');
    if(view){ navigate(view); closeSidebarMobile(); }
  });
  document.getElementById('authScreen').addEventListener('click', (e)=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    e.preventDefault();
    const action = t.getAttribute('data-action');
    if(action==='show-register') renderAuthScreen('register');
    if(action==='show-login') renderAuthScreen('login');
    if(action==='reset-app-data') resetAppData();
  });
}
function toggleSidebarMobile(){ document.getElementById('app').classList.toggle('sidebar-open'); }
function closeSidebarMobile(){ document.getElementById('app').classList.remove('sidebar-open'); }

async function exportInvoiceImage(){
  const node = document.getElementById('feeCardCapture');
  if(!node){ toast('Không tìm thấy phiếu để xuất ảnh'); return; }
  if(typeof html2canvas==='undefined'){ toast('Chưa tải được thư viện xuất ảnh, kiểm tra kết nối mạng'); return; }
  try{
    toast('Đang tạo ảnh...');
    const canvas = await html2canvas(node, {backgroundColor:'#F2F7FC', scale:2, useCORS:true});
    const link = document.createElement('a');
    link.download = 'phieu-hoc-phi.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(e){
    console.error(e);
    toast('Xuất ảnh thất bại, thử dùng nút In / Xuất PDF thay thế');
  }
}

function handleModalClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');
  const id = t.getAttribute('data-id');
  if(action==='modal-close'){ closeModal(); return; }
  if(action==='delete-session'){
    if(confirm('Xoá buổi học này?')){
      const sess = state.sessions.find(s=>s.id===id);
      state.sessions = state.sessions.filter(s=>s.id!==id);
      scheduleSave(); closeModal(); renderView(); toast('Đã xoá buổi học');
      if(sess) deleteSessionFromGoogle(sess);
    }
  }
  if(action==='delete-class'){ if(confirm('Xoá lớp học này? Học sinh trong lớp sẽ không còn gán lớp.')){ state.classes = state.classes.filter(c=>c.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá lớp học'); } }
  if(action==='delete-student'){ if(confirm('Xoá học sinh này?')){ state.students = state.students.filter(s=>s.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá học sinh'); } }
  if(action==='delete-assistant'){ if(confirm('Xoá trợ giảng này?')){ state.assistants = state.assistants.filter(a=>a.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá trợ giảng'); } }
  if(action==='delete-studylog'){ if(confirm('Xoá nhật ký này?')){ state.studyLogs = state.studyLogs.filter(l=>l.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá nhật ký'); } }
  if(action==='delete-grade'){ if(confirm('Xoá điểm số này?')){ state.grades = state.grades.filter(g=>g.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá điểm số'); } }
  if(action==='delete-invoice'){ if(confirm('Xoá phiếu học phí này?')){ state.invoices = state.invoices.filter(i=>i.id!==id); scheduleSave(); closeModal(); renderView(); toast('Đã xoá phiếu học phí'); } }
  if(action==='print-invoice'){ window.print(); }
  if(action==='export-invoice-image'){ exportInvoiceImage(); }
}

function handleContentClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.getAttribute('data-action');
  const id = t.getAttribute('data-id');

  switch(action){
    case 'nav': navigate(t.getAttribute('data-view')); break;
    case 'class-mode-filter': classModeFilter = t.getAttribute('data-mode'); renderView(); break;

    /* schedule */
    case 'cal-prev': calCursor = calMode==='week'? addDays(calCursor,-7) : new Date(calCursor.getFullYear(), calCursor.getMonth()-1, 1); renderView(); break;
    case 'cal-next': calCursor = calMode==='week'? addDays(calCursor,7) : new Date(calCursor.getFullYear(), calCursor.getMonth()+1, 1); renderView(); break;
    case 'cal-today': calCursor = new Date(); renderView(); break;
    case 'cal-mode': calMode = t.getAttribute('data-mode'); renderView(); break;
    case 'export-ics': exportSessionsICS(); break;
    case 'connect-gcal': connectGoogleCalendar(); break;
    case 'sync-gcal': syncAllSessionsToGoogle(); break;
    case 'disconnect-gcal': disconnectGoogleCalendar(); break;
    case 'enable-notify': requestNotificationPermission(); break;
    case 'disable-notify': disableNotifications(); break;
    case 'open-add-session': openModal('Ghi buổi học mới', sessionFormHtml(null), (data)=>{
        const newSess = {id:uid(), classId:data.classId, date:data.date, startTime:data.startTime, endTime:data.endTime, note:data.note||'', status:'scheduled'};
        state.sessions.push(newSess);
        scheduleSave(); renderView(); toast('Đã thêm buổi học');
        if(isGoogleCalendarConnected()) pushSessionToGoogle(newSess);
      }); break;
    case 'view-session': case 'edit-session': {
      const sess = state.sessions.find(s=>s.id===id);
      if(!sess) return;
      openModal('Chi tiết buổi học', sessionFormHtml(sess), (data)=>{
        Object.assign(sess, {classId:data.classId, date:data.date, startTime:data.startTime, endTime:data.endTime, note:data.note||''});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
        if(isGoogleCalendarConnected()) pushSessionToGoogle(sess);
      });
      break;
    }

    /* classes */
    case 'open-add-class': openModal('Thêm lớp học', classFormHtml(null), (data)=>{
        state.classes.push({id:uid(), name:data.name, level:data.level, subject:data.subject, fee:Number(data.fee), schedule:data.schedule||'', color:data.color||CLASS_COLORS[0], note:data.note||'', mode:data.mode==='online'?'online':'offline', courseSessions:data.courseSessions?Number(data.courseSessions):0});
        scheduleSave(); renderView(); toast('Đã thêm lớp học');
      }); break;
    case 'edit-class': {
      const cl = classById(id); if(!cl) return;
      openModal('Sửa lớp học', classFormHtml(cl), (data)=>{
        Object.assign(cl, {name:data.name, level:data.level, subject:data.subject, fee:Number(data.fee), schedule:data.schedule||'', color:data.color||cl.color, note:data.note||'', mode:data.mode==='online'?'online':'offline', courseSessions:data.courseSessions?Number(data.courseSessions):0});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-class': if(confirm('Xoá lớp học này?')){ state.classes = state.classes.filter(c=>c.id!==id); scheduleSave(); renderView(); toast('Đã xoá lớp học'); } break;

    /* students */
    case 'export-csv-students': {
      const headers = ['Họ và tên','Lớp','Ngày sinh','Phụ huynh','SĐT phụ huynh','Địa chỉ','Trạng thái','Ghi chú'];
      const rows = state.students.map(s=>{
        const cl = classById(s.classId);
        return [s.name, cl?cl.name:'', s.dob?fmtDateFull(s.dob):'', s.parentName||'', s.parentPhone||'', s.address||'', s.status==='active'?'Đang học':'Tạm nghỉ', s.note||''];
      });
      exportCSV('study-diary-hoc-sinh.csv', headers, rows);
      break;
    }
    case 'open-add-student': openModal('Thêm học sinh', studentFormHtml(null), (data)=>{
        state.students.push({id:uid(), name:data.name, classId:data.classId||'', dob:data.dob||'', parentName:data.parentName||'', parentPhone:data.parentPhone||'', address:data.address||'', note:data.note||'', status:data.status||'active'});
        scheduleSave(); renderView(); toast('Đã thêm học sinh');
      }); break;
    case 'edit-student': {
      const st = studentById(id); if(!st) return;
      openModal('Sửa thông tin học sinh', studentFormHtml(st), (data)=>{
        Object.assign(st, {name:data.name, classId:data.classId||'', dob:data.dob||'', parentName:data.parentName||'', parentPhone:data.parentPhone||'', address:data.address||'', note:data.note||'', status:data.status||'active'});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-student': if(confirm('Xoá học sinh này?')){ state.students = state.students.filter(s=>s.id!==id); scheduleSave(); renderView(); toast('Đã xoá học sinh'); } break;

    /* assistants */
    case 'open-add-assistant': openModal('Thêm trợ giảng', assistantFormHtml(null), (data)=>{
        state.assistants.push({id:uid(), name:data.name, phone:data.phone||'', email:data.email||'', assignedClassIds:data.assignedClassIds||[], note:data.note||''});
        scheduleSave(); renderView(); toast('Đã thêm trợ giảng');
      }); break;
    case 'edit-assistant': {
      const a = state.assistants.find(x=>x.id===id); if(!a) return;
      openModal('Sửa trợ giảng', assistantFormHtml(a), (data)=>{
        Object.assign(a, {name:data.name, phone:data.phone||'', email:data.email||'', assignedClassIds:data.assignedClassIds||[], note:data.note||''});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-assistant': if(confirm('Xoá trợ giảng này?')){ state.assistants = state.assistants.filter(a=>a.id!==id); scheduleSave(); renderView(); toast('Đã xoá trợ giảng'); } break;

    /* study log */
    case 'export-csv-studylog': {
      const headers = ['Buổi','Ngày','Học sinh','Nội dung','BTVN (%)','Ý thức','Nhận xét','Ghi chú'];
      const rows = state.studyLogs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(l=>{
        const st = studentById(l.studentId);
        return [l.sessionNo||'', fmtDateFull(l.date), st?st.name:'', l.content||'', l.btvn, l.ythuc||'', l.nhanxet||'', l.ghichu||''];
      });
      exportCSV('study-diary-nhat-ky-hoc-tap.csv', headers, rows);
      break;
    }
    case 'open-add-studylog': openModal('Ghi nhật ký buổi học', studyLogFormHtml(null), (data)=>{
        state.studyLogs.push({id:uid(), studentId:data.studentId, sessionNo:data.sessionNo||'', date:data.date, content:data.content||'', btvn:Number(data.btvn||0), ythuc:data.ythuc||'', nhanxet:data.nhanxet||'', ghichu:data.ghichu||''});
        scheduleSave(); renderView(); toast('Đã thêm nhật ký');
      }); break;
    case 'edit-studylog': {
      const l = state.studyLogs.find(x=>x.id===id); if(!l) return;
      openModal('Sửa nhật ký học tập', studyLogFormHtml(l), (data)=>{
        Object.assign(l, {studentId:data.studentId, sessionNo:data.sessionNo||'', date:data.date, content:data.content||'', btvn:Number(data.btvn||0), ythuc:data.ythuc||'', nhanxet:data.nhanxet||'', ghichu:data.ghichu||''});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-studylog': if(confirm('Xoá nhật ký này?')){ state.studyLogs = state.studyLogs.filter(l=>l.id!==id); scheduleSave(); renderView(); toast('Đã xoá nhật ký'); } break;

    /* grades */
    case 'export-csv-grades': {
      const headers = ['Học sinh','Môn','Bài kiểm tra','Điểm','Ngày','Ghi chú'];
      const rows = state.grades.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(g=>{
        const st = studentById(g.studentId);
        return [st?st.name:'', g.subject||'', g.testName||'', g.score, fmtDateFull(g.date), g.note||''];
      });
      exportCSV('study-diary-diem-so.csv', headers, rows);
      break;
    }
    case 'open-add-grade': openModal('Thêm điểm số', gradeFormHtml(null), (data)=>{
        state.grades.push({id:uid(), studentId:data.studentId, subject:data.subject||'Toán', testName:data.testName, score:Number(data.score), date:data.date, note:data.note||''});
        scheduleSave(); renderView(); toast('Đã thêm điểm số');
      }); break;
    case 'edit-grade': {
      const g = state.grades.find(x=>x.id===id); if(!g) return;
      openModal('Sửa điểm số', gradeFormHtml(g), (data)=>{
        Object.assign(g, {studentId:data.studentId, subject:data.subject||'Toán', testName:data.testName, score:Number(data.score), date:data.date, note:data.note||''});
        scheduleSave(); renderView(); toast('Đã lưu thay đổi');
      });
      break;
    }
    case 'delete-grade': if(confirm('Xoá điểm số này?')){ state.grades = state.grades.filter(g=>g.id!==id); scheduleSave(); renderView(); toast('Đã xoá điểm số'); } break;

    /* tuition */
    case 'export-csv-invoices': {
      const headers = ['Học sinh','Tháng','Số buổi','Học phí/buổi','Phụ phí','Tổng thu','Trạng thái','Ghi chú'];
      const rows = state.invoices.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(inv=>{
        const st = studentById(inv.studentId);
        const total = inv.sessions*inv.feePerSession + Number(inv.extra||0);
        return [st?st.name:'', monthLabel(inv.month), inv.sessions, inv.feePerSession, inv.extra||0, total, inv.status==='paid'?'Đã thu':'Chưa thu', inv.note||''];
      });
      exportCSV('study-diary-hoc-phi.csv', headers, rows);
      break;
    }
    case 'open-add-invoice': openModal('Tạo phiếu học phí', invoiceFormHtml(null), (data)=>{
        state.invoices.push({id:uid(), studentId:data.studentId, month:data.month, sessions:Number(data.sessions), feePerSession:Number(data.feePerSession), extra:Number(data.extra||0), note:data.note||'', status:data.status||'unpaid'});
        scheduleSave(); renderView(); toast('Đã tạo phiếu học phí');
      }); break;
    case 'view-invoice': {
      const inv = state.invoices.find(x=>x.id===id); if(!inv) return;
      openModal('Phiếu học phí', invoicePreviewHtml(inv), null, true);
      break;
    }
    case 'view-student-fee': {
      const st = studentById(id); if(!st) return;
      const mKey = currentMonthKey();
      const invList = state.invoices.filter(i=>i.studentId===id).sort((a,b)=>b.month.localeCompare(a.month));
      const inv = invList.find(i=>i.month===mKey) || invList[0];
      if(inv){
        openModal('Phiếu học phí', invoicePreviewHtml(inv), null, true);
      } else {
        openModal('Tạo phiếu học phí', invoiceFormHtml(null, id), (data)=>{
          state.invoices.push({id:uid(), studentId:data.studentId, month:data.month, sessions:Number(data.sessions), feePerSession:Number(data.feePerSession), extra:Number(data.extra||0), note:data.note||'', status:data.status||'unpaid'});
          scheduleSave(); renderView(); toast('Đã tạo phiếu học phí');
        });
        toast('Học sinh chưa có phiếu học phí nào — hãy tạo phiếu đầu tiên');
      }
      break;
    }
    case 'mark-paid': {
      const inv = state.invoices.find(x=>x.id===id); if(!inv) return;
      inv.status='paid'; scheduleSave(); renderView(); toast('Đã đánh dấu đã thu');
      break;
    }
    case 'delete-invoice': if(confirm('Xoá phiếu học phí này?')){ state.invoices = state.invoices.filter(i=>i.id!==id); scheduleSave(); renderView(); toast('Đã xoá phiếu học phí'); } break;

    /* requests */
    case 'open-add-request': openModal('Thêm yêu cầu', requestFormHtml(), (data)=>{
        state.requests.push({id:uid(), from:data.from, content:data.content, date:data.date||isoDate(new Date()), status:data.status||'Mới'});
        scheduleSave(); renderView(); toast('Đã thêm yêu cầu');
      }); break;
    case 'delete-request': if(confirm('Xoá yêu cầu này?')){ state.requests = state.requests.filter(r=>r.id!==id); scheduleSave(); renderView(); toast('Đã xoá yêu cầu'); } break;

    /* feedback */
    case 'open-add-feedback': openModal('Thêm góp ý', feedbackFormHtml(), (data)=>{
        state.feedback.push({id:uid(), from:data.from, content:data.content, rating:Number(data.rating||5), date:data.date||isoDate(new Date())});
        scheduleSave(); renderView(); toast('Đã thêm góp ý');
      }); break;
    case 'delete-feedback': if(confirm('Xoá góp ý này?')){ state.feedback = state.feedback.filter(f=>f.id!==id); scheduleSave(); renderView(); toast('Đã xoá góp ý'); } break;

    /* payments */
    case 'export-csv-payments': {
      const headers = ['Học sinh','Số tiền','Ngày','Hình thức','Ghi chú'];
      const rows = state.payments.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>{
        const st = studentById(p.studentId);
        return [st?st.name:'', p.amount, fmtDateFull(p.date), p.method||'', p.note||''];
      });
      exportCSV('study-diary-thanh-toan.csv', headers, rows);
      break;
    }
    case 'open-add-payment': openModal('Ghi nhận thanh toán', paymentFormHtml(), (data)=>{
        state.payments.push({id:uid(), studentId:data.studentId, amount:Number(data.amount), date:data.date, method:data.method||'Chuyển khoản', note:data.note||''});
        scheduleSave(); renderView(); toast('Đã ghi nhận thanh toán');
      }); break;
    case 'delete-payment': if(confirm('Xoá giao dịch này?')){ state.payments = state.payments.filter(p=>p.id!==id); scheduleSave(); renderView(); toast('Đã xoá giao dịch'); } break;

    /* accounts (quản trị viên) */
    case 'open-add-user': openModal('Thêm tài khoản', userFormHtml(), (data)=>{
        const uname = (data.username||'').trim();
        if(!uname || !data.password || !data.name || !data.email){ toast('Vui lòng điền đầy đủ thông tin'); return; }
        if(state.users.some(u=>(u.username||'').toLowerCase()===uname.toLowerCase())){ toast('Tên đăng nhập đã tồn tại'); return; }
        const role = ['admin','teacher','assistant'].includes(data.role) ? data.role : 'teacher';
        state.users.push({id:uid(), name:data.name.trim(), username:uname, email:(data.email||'').trim(), password:data.password, role, permissions:ROLE_PERMISSIONS[role].slice()});
        scheduleSave(); renderView(); toast('Đã tạo tài khoản');
      }); break;
    case 'delete-user': {
      if(id===currentUser.id){ toast('Không thể xoá chính tài khoản đang đăng nhập'); break; }
      if(confirm('Xoá tài khoản này?')){ state.users = state.users.filter(u=>u.id!==id); scheduleSave(); renderView(); toast('Đã xoá tài khoản'); }
      break;
    }
    case 'reset-user-password': {
      const u = state.users.find(x=>x.id===id); if(!u) return;
      openModal('Đổi mật khẩu', resetPasswordFormHtml(u), (data)=>{
        u.password = data.password; scheduleSave(); toast('Đã cập nhật mật khẩu');
      });
      break;
    }

    /* xoá toàn bộ dữ liệu, giữ giao diện + tài khoản */
    case 'reset-all-data': {
      if(!currentUser || currentUser.role!=='admin'){ toast('Chỉ Quản trị viên mới được thực hiện thao tác này'); break; }
      const ok1 = confirm('Xoá TOÀN BỘ lớp học, học sinh, lịch dạy, nhật ký, điểm số, học phí, thanh toán, yêu cầu và góp ý?\nKhông thể hoàn tác. Tài khoản đăng nhập và thông tin giáo viên sẽ được giữ nguyên.');
      if(!ok1) break;
      const typed = prompt('Để xác nhận, hãy gõ chính xác chữ XOA (không dấu, in hoa):');
      if(typed !== 'XOA'){ toast('Đã huỷ — không có gì bị xoá'); break; }
      ['classes','students','assistants','sessions','studyLogs','grades','invoices','payments','requests','feedback'].forEach(key=>{ state[key] = []; });
      scheduleSave();
      renderView();
      toast('Đã xoá toàn bộ dữ liệu, chỉ còn giữ lại giao diện');
      break;
    }

    /* settings avatar */
    case 'remove-avatar': {
      const urlField = document.getElementById('avatarUrlField');
      if(urlField) urlField.value = '';
      const preview = document.getElementById('avatarPreview');
      if(preview) preview.textContent = (document.querySelector('#settingsForm [name=teacherName]').value||'G').trim().charAt(0).toUpperCase();
      const removeBtn = e.target.closest('[data-action="remove-avatar"]');
      if(removeBtn) removeBtn.remove();
      break;
    }
  }
}

function handleContentChange(e){
  if(e.target.id==='studyLogFilterSelect'){ studyLogFilter = e.target.value; renderView(); }
  if(e.target.id==='gradeFilterSelect'){ gradeFilter = e.target.value; renderView(); }
  if(e.target.id==='reqFilterSelect'){ requestFilterStatus = e.target.value; renderView(); }
  if(e.target.getAttribute && e.target.getAttribute('data-action')==='change-request-status'){
    const id = e.target.getAttribute('data-id');
    const r = state.requests.find(x=>x.id===id);
    if(r){ r.status = e.target.value; scheduleSave(); renderView(); toast('Đã cập nhật trạng thái'); }
  }
  if(e.target.getAttribute && e.target.getAttribute('data-action')==='change-user-role'){
    const id = e.target.getAttribute('data-id');
    const u = state.users.find(x=>x.id===id);
    if(u && id!==currentUser.id){
      u.role = e.target.value;
      u.permissions = (ROLE_PERMISSIONS[u.role]||ROLE_PERMISSIONS.teacher).slice();
      scheduleSave(); renderView(); toast('Đã cập nhật vai trò tài khoản');
    }
  }
  if(e.target.id==='avatarFile'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 1.5*1024*1024){ toast('Ảnh quá lớn, vui lòng chọn ảnh dưới 1.5MB'); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      document.getElementById('avatarUrlField').value = dataUrl;
      document.getElementById('avatarPreview').innerHTML = `<img src="${dataUrl}" alt="Ảnh đại diện">`;
    };
    reader.readAsDataURL(file);
  }
}

function handleContentSubmit(e){
  if(e.target.id==='settingsForm'){
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {};
    fd.forEach((v,k)=>data[k]=v);
    state.settings = {...state.settings, ...data};
    scheduleSave();
    renderSidebar();
    toast('Đã lưu cài đặt');
  }
  if(e.target.id==='notifySettingsForm'){
    e.preventDefault();
    const fd = new FormData(e.target);
    const mins = Number(fd.get('notifyLeadMinutes'))||15;
    state.settings.notifyLeadMinutes = mins;
    scheduleSave();
    toast('Đã lưu số phút báo trước');
  }
}

/* =========================================================
   INIT
   ========================================================= */
async function init(){
  try{
    document.getElementById('topToday').textContent = new Date().toLocaleDateString('vi-VN', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
    await loadState();
    attachDelegation();
    let savedUserId = null;
    try{ savedUserId = localStorage.getItem(SESSION_KEY); }catch(err){}
    const savedUser = savedUserId ? state.users.find(u=>u.id===savedUserId) : null;
    if(savedUser){
      currentUser = savedUser;
      enterApp();
    } else {
      showLogin();
    }
  }catch(err){
    console.error('Lỗi khởi tạo Study Diary:', err);
    showFatalError(err);
  }
}
function showFatalError(err){
  const appEl = document.getElementById('app');
  if(appEl) appEl.style.display='none';
  const authScreen = document.getElementById('authScreen');
  const authBody = document.getElementById('authBody');
  if(authScreen) authScreen.style.display='flex';
  if(authBody){
    authBody.innerHTML = `
      <div class="auth-error" style="display:block;">
        Có lỗi khi tải ứng dụng: ${escapeHtml((err&&err.message)||String(err))}<br>Vui lòng tải lại trang. Nếu vẫn lỗi, hãy bấm nút bên dưới để xoá dữ liệu cũ đang lưu trong trình duyệt và bắt đầu lại.
      </div>
      <button type="button" class="btn btn-danger" style="width:100%;justify-content:center;" data-action="reset-app-data">Xoá dữ liệu cũ &amp; tải lại</button>
    `;
  }
}
function resetAppData(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  location.reload();
}
/* Lưới an toàn cuối cùng: nếu vì bất kỳ lý do gì mà sau 8 giây trang vẫn
   trắng (không phải màn hình đăng nhập, không phải app), tự động hiển thị
   lại màn hình đăng nhập với dữ liệu mặc định để không ai bị kẹt ở trang trắng. */
setTimeout(()=>{
  try{
    const authEl = document.getElementById('authScreen');
    const appEl = document.getElementById('app');
    const stuck = authEl && appEl && authEl.style.display!=='flex' && appEl.style.display!=='flex';
    if(stuck){
      console.error('Study Diary: phát hiện trang bị treo khi khởi động, tự khôi phục màn hình đăng nhập.');
      if(!state || typeof state!=='object'){ state = seedData(); }
      try{ attachDelegation(); }catch(e){}
      showLogin();
    }
  }catch(e){ /* bỏ qua */ }
}, 8000);

init();
</script>
